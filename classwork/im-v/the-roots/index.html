<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="main.css" />
  <title>Undun</title>
</head>

<body class="bg-gray-100">
  <main class="mt-32 w-[90%] mx-auto xl:w-1/3 md:w-[80%]">
    <h1 class="text-6xl font-bold mb-4 text-center">Undun</h1>
    <form id="taskMaster" class="flex flex-col mb-4 rounded-md bg-yellow-100 p-4">
      <label for="task" class="grow w-full block font-bold mb-2">What do you want?</label>
      <p class="flex justify-between gap-4">
        <input type="text" id="task" name="task" class="grow border bg-white border-gray-300 rounded-md p-2" />
        <button type="submit" class="bg-blue-500 text-white rounded-md p-2">add</button>
      </p>
    </form>
    <section class="grid grid-cols-2 gap-8 text-xl">
      <ol class="list-decimal" id="undone">
        <li>
          <span>the quick brown fox jumped over the lazy dog</span>
          <input type="checkbox" />
          <a href="#">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 fill-red-400" viewBox="0 0 256 256">
              <path
                d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z">
              </path>
            </svg>
          </a>
        </li>
      </ol>
      <ol class="list-decimal" id="done"></ol>
    </section>
  </main>
  <!-- NOTE: this is the terrible way to do it -->
  <!-- <script src="main.js" defer></script> -->
  <!-- NOTE: this is the way -->
  <script src="app.js" defer></script>

</body>

</html>
